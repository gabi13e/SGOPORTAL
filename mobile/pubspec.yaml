name: sgo_scholar
description: SGO Scholar mobile app — for approved scholarship grantees.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.4
  firebase_storage: ^13.0.4

  # Routing
  go_router: ^17.2.3

  # AI — Gemini (kept for fallback support)
  google_generative_ai: ^0.4.7

  # HTTP client for OpenRouter API
  http: ^1.5.0

  # File picker for document uploads
  file_picker: ^11.0.2

  # State helpers
  provider: ^6.1.5

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
